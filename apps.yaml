# Apps configuration for F-Droid repository
# Only apps listed here will have their metadata managed by metascoop
# The fdroid update command with --delete-unknown will remove metadata for unlisted apps

trampoline:
  git: https://github.com/MaximilienNaveau/trampoline
  name: "Trampoline"
  description: |
    Trampoline est un jeu de lettres imaginé par Michel Cheenne et réalisé par Maximilien Naveau : 13 mots de 9 lettres à construire sur une grille, avec des lettres qui « rebondissent ».

    Chaque tuile a deux faces, une jaune et une verte, avec une lettre différente de chaque côté. Posez un mot sur une ligne, touchez une lettre pour la retourner, allongez les mots déjà posés, échangez une lettre avec celles de votre main, déplacez un bloc de lettres… Le jaune rapporte, le vert coûte, et les dernières lettres d'un mot rapportent le plus.

    • Seul ou de 2 à 4 joueurs sur le même appareil
    • Jeu libre et 10 grilles de mots croisés
    • « Comment jouer » : les règles en petites animations
    • Dictionnaire français complet, sans connexion
    • Musique et bruitages originaux
    • Sans publicité, sans pistage, aucune donnée collectée
    • Logiciel libre (GPL-3.0)

    Trampoline is a French word game designed by Michel Cheenne and made by Maximilien Naveau: build 13 nine-letter words on a grid, with tiles whose two faces (yellow and green) carry different letters. Solo or 2-4 players on one device, free play and 10 crosswords, animated rules, no ads, no tracking. The game is in French.

  # As described on https://f-droid.org/en/docs/Build_Metadata_Reference/#Categories,
  # you can use any name here, but you should look at the existing categories first
  categories: 
    - Games
    - Writing
  
  # Skip v3.0.0 due to incorrect package name (com.Magamajo.trampoline instead of com.magamajo.trampoline)
  # Skip v3.1.2 - release has no APK attached
  # Skip v3.1.0 - the only APK signed with another key (3f8ac7bb...): with it
  # in the repo, fdroid made that key the preferred signer and recommended
  # this old Unity build instead of the current one (signed 89ce10f0...).
  skip_versions:
    - "v3.0.0"
    - "v3.1.0"
    - "v3.1.2"
